  function ausPasswort(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function (basis) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(D.salz), iterations: D.iter, hash: "SHA-256" }, basis, 256);
    }).then(function (b) { return new Uint8Array(b); });
  }
  function zeige(html) {
    // erst wenn die Anmeldeseite fertig geladen ist, sonst bleiben ihre Reste stehen
    function los() { document.open(); document.write(html); document.close(); }
    if (document.readyState === "complete") los(); else window.addEventListener("load", los, { once: true });
  }
  function formular() { document.getElementById("form").hidden = false; document.getElementById("pw").focus(); }

  if (!window.crypto || !crypto.subtle) {
    document.body.innerHTML = '<p style="padding:24px">Diese Seite braucht eine sichere Verbindung (https). Bitte über die Internetadresse öffnen.</p>';
    return;
  }
  var params = new URLSearchParams(location.search);
  if (params.has("abmelden")) { vergessen(); history.replaceState(null, "", location.pathname); }

  // Schlüssel aus QR-Code (#k=...) oder vom Gerät
  var ausAdresse = (location.hash.match(/[#&]k=([0-9a-f]{64})/) || [])[1];
  if (ausAdresse) history.replaceState(null, "", location.pathname + location.search);
  var kandidat = ausAdresse;
  if (!kandidat) { try { kandidat = localStorage.getItem(SPEICHER); } catch (e) {} }

  if (kandidat && /^[0-9a-f]{64}$/.test(kandidat)) {
    entschluesseln(vonHex(kandidat)).then(function (html) {
      merken(kandidat); zeige(html);
    }).catch(function () { vergessen(); formular(); });
  } else formular();

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var knopf = document.getElementById("los"), fehler = document.getElementById("fehler");
    knopf.disabled = true; knopf.textContent = "Wird geöffnet …"; fehler.textContent = "";
    var roh;
    ausPasswort(document.getElementById("pw").value).then(function (k) { roh = k; return entschluesseln(k); }).then(function (html) {
      if (document.getElementById("merken").checked) merken(hex(roh));
      zeige(html);
    }).catch(function () {
      knopf.disabled = false; knopf.textContent = "Öffnen"; fehler.textContent = "Das Passwort stimmt nicht.";
    });
  });
})();
</script>
</body>
