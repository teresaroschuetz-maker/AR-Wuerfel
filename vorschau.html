  var SPEICHER = "arwuerfel-schluessel";
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function hex(a) { return Array.prototype.map.call(a, function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }
  function vonHex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function merken(k) { try { localStorage.setItem(SPEICHER, k); } catch (e) {} }
  function vergessen() { try { localStorage.removeItem(SPEICHER); } catch (e) {} }

  function entschluesseln(rohSchluessel) {
    return crypto.subtle.importKey("raw", rohSchluessel, "AES-GCM", false, ["decrypt"]).then(function (k) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.iv) }, k, bytes(D.ct));
    }).then(function (b) { return new TextDecoder().decode(b); });
  }
  function ausPasswort(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function (basis) {

    function los() { document.open(); document.write(html); document.close(); }

  function formular() { document.getElementById("form").hidden = false; document.getElementById("pw").focus(); }
