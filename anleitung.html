<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#F6F4EF;color:#22252B}

</style>

  var SPEICHER = "arwuerfel-schluessel";
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

  function entschluesseln(rohSchluessel) {
    return crypto.subtle.importKey("raw", rohSchluessel, "AES-GCM", false, ["decrypt"]).then(function (k) {

  function ausPasswort(pw) {
